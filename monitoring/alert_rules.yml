# monitoring/alert_rules.yml
groups:
  - name: monitored_api_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(app_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(app_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Error rate above 5% for 5 minutes"
          description: "Current error rate: {{ $value | humanizePercentage }}"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            rate(app_http_request_duration_seconds_bucket[5m])
          ) > 1.0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "P95 latency above 1 second"

      - alert: ServiceDown
        expr: up{job="monitored-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Monitored API is down"
